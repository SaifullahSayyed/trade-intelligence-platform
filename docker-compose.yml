# Docker Compose Specification

# =============================================================
# Trade Intelligence Platform — Local Development Stack
# =============================================================
# Usage:
#   make up          -> core services (postgres, clickhouse, opensearch, keycloak, minio)
#   make up-dagster  -> core + dagster orchestration
#   make up-full     -> core + dagster + monitoring
#
# All secrets from .env  (copy .env.example -> .env, fill in values)
# NEVER commit .env
# =============================================================

x-common-env: &common-env
  TZ: UTC

services:

  # -----------------------------------------------------------
  # PostgreSQL — Transactional DB
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ti_postgres
    restart: unless-stopped
    environment:
      <<: *common-env
      POSTGRES_DB: ${POSTGRES_DB:-trade_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-ti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ti_user} -d ${POSTGRES_DB:-trade_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ti_network

  # -----------------------------------------------------------
  # ClickHouse — Analytical DB
  # -----------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: ti_clickhouse
    restart: unless-stopped
    environment:
      <<: *common-env
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-trade_intelligence}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ti_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ti_network

  # -----------------------------------------------------------
  # OpenSearch — Search Engine
  # -----------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: ti_opensearch
    restart: unless-stopped
    environment:
      <<: *common-env
      cluster.name: ti-cluster
      node.name: ti-node-1
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:?OPENSEARCH_ADMIN_PASSWORD is required}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:${OPENSEARCH_ADMIN_PASSWORD} https://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ti_network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: ti_opensearch_dashboards
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      <<: *common-env
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD}
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    networks:
      - ti_network

  # -----------------------------------------------------------
  # Keycloak — Identity & Auth (self-hosted SSO, backed by Postgres)
  # -----------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ti_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trade_intelligence}
      KC_DB_USERNAME: ${POSTGRES_USER:-ti_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ti_network

  # -----------------------------------------------------------
  # MinIO — Local S3-compatible Object Storage (dev stand-in for R2)
  # -----------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: ti_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      <<: *common-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ti_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || curl -sf http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ti_network

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: ti_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ti_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/ti-bronze-raw;
      mc mb --ignore-existing local/ti-bronze-archive;
      echo 'MinIO buckets initialized.';
      "
    networks:
      - ti_network

  # -----------------------------------------------------------
  # Dagster — Orchestration (profile: dagster)
  # -----------------------------------------------------------
  dagster-webserver:
    image: python:3.11-slim
    container_name: ti_dagster_webserver
    restart: unless-stopped
    profiles: ["dagster", "all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      DAGSTER_PG_USERNAME: ${POSTGRES_USER:-ti_user}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: 5432
      DAGSTER_PG_DB: dagster
      POSTGRES_HOST: postgres
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ti_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ti_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./orchestration:/opt/dagster/app
      - dagster_storage:/opt/dagster/storage
      - ./ingestion:/opt/dagster/ingestion
      - ./contracts:/opt/dagster/contracts
    working_dir: /opt/dagster/app
    command: >
      /bin/sh -c "
      pip install dagster dagster-webserver dagster-postgres clickhouse-driver dlt pyyaml pandas --quiet &&
      dagster-webserver -h 0.0.0.0 -p 3001 -w /opt/dagster/app/workspace.yaml
      "
    ports:
      - "${DAGSTER_PORT:-3001}:3001"
    networks:
      - ti_network

  dagster-daemon:
    image: python:3.11-slim
    container_name: ti_dagster_daemon
    restart: unless-stopped
    profiles: ["dagster", "all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      DAGSTER_PG_USERNAME: ${POSTGRES_USER:-ti_user}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: 5432
      DAGSTER_PG_DB: dagster
    volumes:
      - ./orchestration:/opt/dagster/app
      - dagster_storage:/opt/dagster/storage
      - ./ingestion:/opt/dagster/ingestion
      - ./contracts:/opt/dagster/contracts
    working_dir: /opt/dagster/app
    command: >
      /bin/sh -c "
      pip install dagster dagster-postgres clickhouse-driver dlt pyyaml pandas --quiet &&
      dagster-daemon run
      "
    networks:
      - ti_network

  # -----------------------------------------------------------
  # Prometheus + Grafana — Monitoring (profile: monitoring)
  # -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ti_prometheus
    restart: unless-stopped
    profiles: ["monitoring", "all"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - ti_network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ti_grafana
    restart: unless-stopped
    profiles: ["monitoring", "all"]
    depends_on:
      - prometheus
    environment:
      <<: *common-env
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - ti_network

# =============================================================

  # -----------------------------------------------------------
  # Next.js / React Frontend Dashboard
  # -----------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: ti_frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      <<: *common-env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trade_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-ti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npm run dev"
    networks:
      - ti_network
volumes:
  frontend_node_modules:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  opensearch_data:
  minio_data:
  dagster_storage:
  prometheus_data:
  grafana_data:

networks:
  ti_network:
    driver: bridge
    name: trade_intelligence_network

